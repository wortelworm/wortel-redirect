[package]
name = "wortel-redirect"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
etcetera = "0.11.0"
flate2 = "1.1.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false }
urlencoding = "2.1.3"
